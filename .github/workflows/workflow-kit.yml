name: Workflow kit
on:
  push:
    paths: ['workflow-kit/**', '.github/workflows/workflow-kit.yml']
  pull_request:
    paths: ['workflow-kit/**', '.github/workflows/workflow-kit.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test workflow-kit/tests/*.test.mjs
